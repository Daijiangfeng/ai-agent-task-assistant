# Alembic configuration (database schema migrations).
#
# Usage (from repo root):
#   alembic upgrade head                                  # apply all migrations (deploy step)
#   alembic revision --autogenerate -m "description"      # generate migration from ORM changes
#   alembic downgrade -1                                  # rollback one revision
#   alembic history                                       # show migration history
#
# sqlalchemy.url is intentionally empty: migrations/env.py resolves it from
# application Settings (PostgreSQL). It can also be set here or via CLI.

[alembic]
script_location = migrations
prepend_sys_path = .
# Revision file names include date and slug for traceability
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Resolved by env.py from application settings
sqlalchemy.url =

# NOTE: keep this file ASCII-only. On zh-CN Windows the alembic CLI reads the
# ini with the GBK locale codec, and non-ASCII comments would break parsing.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
