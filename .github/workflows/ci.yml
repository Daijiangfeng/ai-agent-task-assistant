name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quality gate (ruff + pytest)
        run: python scripts/check.py

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # 忽略 PYSEC-2026-311（chromadb >=1.0.0，经 trust_remote_code=true 触发的认证前代码执行）：
        # 官方暂无修复版本；本项目未使用 trust_remote_code，chromadb 为内嵌持久化使用，未对外暴露服务端点，实际不可利用。
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --desc on --progress-spinner off
